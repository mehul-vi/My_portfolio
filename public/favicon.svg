<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark premium backing tile for perfect tab visibility in both light & dark browser themes -->
  <rect width="32" height="32" rx="8" fill="#0A0A0C" />
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="url(#logo-grad)" stroke-width="1" opacity="0.15" />
  
  <!-- Stylized geometric letter 'M' with glowing developer chevrons visual theme -->
  <path d="M8 23V9L16 17L24 9V23" stroke="url(#logo-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" fill="none" />
  
  <!-- Modern digital accent dot -->
  <circle cx="16" cy="6.5" r="1.5" fill="#38bdf8" />
</svg>